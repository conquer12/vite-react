<!-- Adicionado fallback para logo caso imagem falhe -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const img = document.querySelector('img.logo');
    if (img) img.onerror = function() { this.style.display='none'; };
  });
</script>
